const FXC=['#FDB515','#1473D1','#2E9A35','#E2584A','#7B5BD6'];
function burst(n){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const fx=document.getElementById('fx');n=n||26;

function showSets(m){stopTimer();G=null;RNG=Math.random;const T={build:'পরমাণু বানাও',speed:'বিদ্যুৎ গতি',formula:'সংকেত জোড়া'},d=save.sets[m]||{},tiers=[['সহজ','1–10'],['মাঝারি','11–20'],['কঠিন','21–30']];

/* build */
function opts1(z){return shuffle(shuffle([z-2,z-1,z+1,z+2].filter(v=>v>=1&&v<=20)).slice(0,3).concat([z]))}
function startBuild(n){stopTimer();RNG=seeded(n*7919+11);const P=POOL(n),noble=pick(P.filter(e=>e.f==='noble')),mid=shuffle(P.filter(e=>{const o=outer(e.z);return o>=5&&o<=7})).slice(0,2),low=shuffle(P.filter(e=>outer(e.z)<=4)).slice(0,2);
  G={mode:'build',set:n,q:shuffle([noble].concat(mid,low)),i:0,pts:0,log:[]};newRound()}
function newRound(){const el=G.q[G.i];Object.assign(G,{el,step:1,sub:'rule',counts:[0,0,0,0],hint:false,t1:[],tr:[],tv:[],w1:0,m2:0,wr:0,wv:0,msg:'',mt:'',done:false,rp:0,last:null,shake:null,o1:opts1(el.z)});renderBuild();scrollTo(0,0)}
const capMsg=i=>i===0?'K কক্ষে সর্বোচ্চ 2টি ইলেকট্রন থাকে (2 × 1² = 2)। বাকিগুলো পরের কক্ষে দাও।':i===1?'L কক্ষে সর্বোচ্চ 8টি ইলেকট্রন থাকে (2 × 2² = 8)। বাকিগুলো পরের কক্ষে দাও।':i===2?'M কক্ষের ধারণক্ষমতা 18 হলেও বাইরের কক্ষে 8টির বেশি ইলেকট্রন থাকে না। বাকিগুলো N কক্ষে দাও।':'এই মৌলের জন্য N কক্ষে 2টির বেশি লাগে না।';
const RT={a:'যোজনী = শেষ কক্ষের ইলেকট্রন সংখ্যা',b:'যোজনী = 8 − শেষ কক্ষের ইলেকট্রন সংখ্যা',c:'শেষ কক্ষ পূর্ণ (8টি), তাই যোজনী = 0'};
function renderBuild(){const g=G,el=g.el,c=g.counts,cfg=config(el.z),oi=cfg.length-1,o=cfg[oi],placed=sum(c);
  const atom=atomSVG(g.step===1?[0,0,0,0]:c,g.step===1?'?':el.z,g.step===3?oi:-1,g.last);g.last=null;
  const names=['পারমাণবিক সংখ্যা','ইলেকট্রন বিন্যাস','যোজনী'];
  const steps='<div class="steps">'+names.map((n,i)=>'<span class="step '+(g.done||g.step>i+1?'done':(g.step===i+1?'now':''))+'"><i>'+(i+1)+'</i>'+n+'</span>').join('')+'</div>';
  let body='';
  if(g.step===1)body='<p class="q">'+el.n+' ('+el.s+')-এর পারমাণবিক সংখ্যা কত? নিরপেক্ষ পরমাণুতে মোট ইলেকট্রনও ততটি।</p><div class="opts">'+g.o1.map(v=>'<button class="opt'+(g.t1.includes(v)?' bad':'')+'" data-act="p1" data-v="'+v+'"'+(g.t1.includes(v)?' disabled':'')+'>'+v+'</button>').join('')+'</div><div><button class="ghost" data-act="hint1"'+(g.hint?' disabled':'')+'>হিন্ট: মৌলের ক্রম দেখো (−5)</button></div>'+(g.hint?'<div class="strip">'+SYMS.map((s,i)=>'<span class="sc'+(s===el.s?' me':'')+'"><i>'+(i+1)+'</i>'+s+'</span>').join('')+'</div>':'');
  else if(g.step===2)body='<p class="q">'+el.z+'টি ইলেকট্রন কক্ষে বসাও। ভেতরের কক্ষ আগে ভরে।</p><div class="remain"><span>বাকি ইলেকট্রন</span><strong>'+(el.z-placed)+'</strong></div><div class="shells">'+SH.map((s,i)=>'<button class="shell'+(c[i]>=CAP[i]?' full':'')+'" data-act="place" data-i="'+i+'" aria-label="'+s+' কক্ষে ইলেকট্রন বসাও"><b>'+s+'</b><span>'+c[i]+' / '+CAP[i]+'</span></button>').join('')+'</div><div><button class="ghost" data-act="undo"'+(placed?'':' disabled')+'>↩ শেষটা সরাও</button></div>';
  else if(!g.done&&g.sub==='rule')body='<p class="q">'+SH[oi]+' কক্ষ হলো শেষ শক্তিস্তর। এতে ইলেকট্রন আছে '+o+'টি (সোনালি)। কোন নিয়ম খাটবে?</p><div class="rulebtns">'+[['a','1–4'],['b','5–7'],['c','8']].map(r=>{const bad=g.tr.includes(r[0]);return '<button class="opt left'+(bad?' bad':'')+'" data-act="rule" data-k="'+r[0]+'"'+(bad?' disabled':'')+'><b>'+r[1]+'</b>'+RT[r[0]]+'</button>'}).join('')+'</div>';
  else if(!g.done)body='<p class="q">নিয়ম: '+RT[ruleOf(o)]+'। '+el.s+'-এর যোজনী কত?</p><div class="opts five">'+[0,1,2,3,4].map(v=>{const bad=g.tv.includes(v);return '<button class="opt'+(bad?' bad':'')+'" data-act="val" data-v="'+v+'"'+(bad?' disabled':'')+'>'+v+'</button>'}).join('')+'</div>';
  else body='<div class="done"><p class="big">'+el.s+'-এর যোজনী '+valency(el.z)+'</p><p class="why">'+why(el)+'</p><p>এই মৌলে +'+g.rp+' পয়েন্ট</p><button class="primary" data-act="next">'+(g.i+1>=g.q.length?'ফলাফল দেখো':'পরের মৌল →')+'</button></div>';
  paint('<div class="wrap">'+topbar('পরমাণু বানাও · সেট '+g.set,'<span class="chip">মৌল <b>'+(g.i+1)+'/'+g.q.length+'</b></span><span class="chip">পয়েন্ট <b>'+(g.pts+(g.done?0:g.rp))+'</b></span>')+'<div class="build"><section class="stage">'+atom+'<div class="cfg">'+(g.step>=2&&placed?config(placed).join(', '):'')+(g.step===3?'<small>শেষ কক্ষের ইলেকট্রন সোনালি রঙে</small>':'')+'</div></section><section class="panel">'+steps+'<div class="who">'+tile(el,'')+'<div class="small">'+el.n+'<br>প্রতীক '+el.s+'</div></div>'+body+'<p class="msg '+g.mt+'" role="status" aria-live="polite">'+g.msg+'</p></section></div></div>');
  if(g.shake){const n=$app.querySelector(g.shake);if(n)n.classList.add('shake');g.shake=null}}
const setMsg=(t,ty)=>{G.msg=t;G.mt=ty||''};
const A={home:()=>{RNG=Math.random;home();scrollTo(0,0)},sets:d=>showSets(d.k),play:d=>{({build:startBuild,speed:startSpeed,formula:startFormula})[d.k](+d.v);scrollTo(0,0)}};
A.p1=d=>{const g=G,v=+d.v;if(v===g.el.z){g.rp+=Math.max(0,10-2*g.w1-(g.hint?5:0));g.step=2;setMsg('ঠিক! এবার ইলেকট্রনগুলো কক্ষে বসাও।','ok')}else{g.w1++;g.t1.push(v);g.shake='[data-act="p1"][data-v="'+v+'"]';setMsg('এটা নয়। আবার ভাবো, লাগলে হিন্ট নাও।','bad')}renderBuild()};
A.hint1=()=>{G.hint=true;renderBuild()};
A.place=d=>{const g=G,i=+d.i,c=g.counts,fail=t=>{g.m2++;g.shake='[data-act="place"][data-i="'+i+'"]';setMsg(t,'bad');renderBuild()};
  for(let j=0;j<i;j++)if(c[j]<CAP[j])return fail('আগে '+SH[j]+' কক্ষ পূর্ণ করো। ভেতরের কক্ষ আগে ভরে, তারপর বাইরের কক্ষ।');
  if(c[i]>=CAP[i])return fail(capMsg(i));c[i]++;g.last=[i,c[i]-1];setMsg('','');

A.undo=()=>{const c=G.counts;for(let i=3;i>=0;i--)if(c[i]>0){c[i]--;break}setMsg('','');renderBuild()};

A.val=d=>{const g=G,v=+d.v,o=outer(g.el.z);if(v===valency(g.el.z)){g.rp+=Math.max(5,20-5*g.wv);g.done=true;g.pts+=g.rp;g.log.push({el:g.el,pts:g.rp});setMsg('','');burst(28)}
  else{g.wv++;g.tv.push(v);g.shake='[data-act="val"][data-v="'+v+'"]';const k=ruleOf(o);setMsg(k==='a'?'শেষ কক্ষে যে কয়টি ইলেকট্রন আছে, যোজনী সেটাই।':(k==='b'?'8 থেকে '+o+' বিয়োগ করে দেখো।':'পূর্ণ কক্ষের যোজনী শূন্য।'),'bad')}renderBuild()};
A.next=()=>{if(G.i+1<G.q.length){G.i++;newRound();return}const isBest=commit('build',G.pts);
  results({title:'পরীক্ষা শেষ',score:G.pts,max:350,isBest,extra:'<ul class="missed">'+G.log.map(l=>'<li>'+tile(l.el,'sm')+'<span>'+why(l.el)+'<br>'+l.pts+' / 70 পয়েন্ট</span></li>').join('')+'</ul>',mode:'build',set:G.set})};
/* speed */
function startSpeed(n){stopTimer();RNG=seeded(n*7919+22);G={mode:'speed',set:n,score:0,streak:0,bestStreak:0,ok:0,n:0,missed:{},cur:null,end:Date.now()+60000,fb:null,over:false};nextQ();renderSpeed();timer=setInterval(tick,100)}
function nextQ(){let e;do{e=pick(POOL(G.set))}while(e===G.cur);G.cur=e}
const remaining=()=>Math.max(0,G.end-Date.now());
function renderSpeed(){const g=G,left=remaining();
  paint('<div class="wrap">'+topbar('বিদ্যুৎ গতি · সেট '+g.set,'<span class="chip">ধারা <b>'+g.streak+'</b></span><span class="chip">পয়েন্ট <b>'+g.score+'</b></span>')+'<div class="track'+(left<10000?' low':'')+'" id="trk" role="progressbar" aria-label="বাকি সময়"><i id="fill" style="width:'+Math.min(100,left/600)+'%"></i></div><p class="small" style="margin-top:6px;text-align:right"><span id="secs">'+Math.ceil(left/1000)+'</span> সেকেন্ড বাকি</p><main class="speed">'+tile(g.cur,'lg')+'<p class="q">'+g.cur.n+'-এর যোজনী কত?</p><div class="opts five">'+[0,1,2,3,4].map(v=>'<button class="opt" data-act="ans" data-v="'+v+'">'+v+'</button>').join('')+'</div><div class="fb '+(g.fb?g.fb.t:'')+'" role="status" aria-live="polite">'+(g.fb?g.fb.m:'শেষ কক্ষের ইলেকট্রন গুনে নিয়ম খাটাও। কিবোর্ডে 0–4 চাপলেও চলবে।')+'</div></main></div>')}
function tick(){if(!G||G.mode!=='speed'||G.over)return;const left=remaining(),f=document.getElementById('fill'),s=document.getElementById('secs'),t=document.getElementById('trk');
  if(f)f.style.width=Math.min(100,left/600)+'%';if(s)s.textContent=Math.ceil(left/1000);if(t)t.classList.toggle('low',left<10000);if(left<=0)finishSpeed()}
function answerSpeed(v){const g=G;if(!g||g.mode!=='speed'||g.over)return;const el=g.cur,ok=v===valency(el.z);g.n++;
  if(ok){g.ok++;g.score+=10+Math.min(g.streak,6)*2;g.streak++;g.bestStreak=Math.max(g.bestStreak,g.streak);if(g.streak%5===0)burst(18);g.fb={t:'ok',m:'ঠিক! '+why(el)}}
  else{g.streak=0;g.end-=2000;g.missed[el.s]=el;g.fb={t:'bad',m:'উত্তর '+valency(el.z)+' হবে (−2 সেকেন্ড)। '+why(el)}}
  nextQ();if(remaining()<=0){finishSpeed();return}renderSpeed()}
A.ans=d=>answerSpeed(+d.v);
function finishSpeed(){const g=G;if(!g||g.over)return;g.over=true;stopTimer();const isBest=commit('speed',g.score),miss=Object.values(g.missed).slice(0,6);
  results({title:'সময় শেষ',score:g.score,max:0,stars:g.score>=200?3:(g.score>=100?2:1),isBest,mode:'speed',set:g.set,extra:'<div class="stats"><span class="chip">সঠিক <b>'+g.ok+'/'+g.n+'</b></span><span class="chip">সবচেয়ে লম্বা ধারা <b>'+g.bestStreak+'</b></span></div>'+(miss.length?'<h3>আবার দেখে নাও</h3><ul class="missed">'+miss.map(e=>'<li>'+tile(e,'sm')+'<span>'+why(e)+'</span></li>').join('')+'</ul>':'<p class="small">একটাও ভুল হয়নি।</p>')})}
/* formula */
function startFormula(n){stopTimer();RNG=seeded(n*7919+33);G={mode:'formula',set:n,qs:shuffle(PAIRS.slice(0,n<=10?12:(n<=20?18:24))).slice(0,8).map(pr=>{const p=pairInfo(pr[0],pr[1]);p.o=pairOpts(p);return p}),i:0,score:0,ok:0,sel:null};renderFormula()}
function renderFormula(){const g=G,p=g.qs[g.i],ans=g.sel!==null;
  const opts=p.o.map((c,idx)=>{const right=c[0]===p.cx&&c[1]===p.cy,cls=ans?(right?' right':(g.sel===idx?' bad':'')):'';return '<button class="opt formula'+cls+'" data-act="fpick" data-i="'+idx+'"'+(ans?' disabled':'')+'>'+fmt(p.a,c[0],p.b,c[1])+'</button>'}).join('');
  let ledger='';if(ans)ledger='<div class="ledger"><span>1. যোজনী: <b>'+p.a.s+' = '+p.va+', '+p.b.s+' = '+p.vb+'</b></span><span>2. ক্রস করো: <b>'+p.a.s+'-এর নিচে '+p.x+', '+p.b.s+'-এর নিচে '+p.y+'</b></span><span>3. '+(p.g>1?'দুটোকে '+p.g+' দিয়ে ভাগ করো':'আর সরল হয় না')+': <b>'+fmt(p.a,p.cx,p.b,p.cy)+'</b></span></div><button class="primary" data-act="fnext">'+(g.i+1>=g.qs.length?'ফলাফল দেখো':'পরের প্রশ্ন →')+'</button>';
  paint('<div class="wrap">'+topbar('সংকেত জোড়া · সেট '+g.set,'<span class="chip">প্রশ্ন <b>'+(g.i+1)+'/'+g.qs.length+'</b></span><span class="chip">পয়েন্ট <b>'+g.score+'</b></span>')+'<main class="speed"><div class="pair"><div class="col">'+tile(p.a,'')+'<span class="val">যোজনী '+p.va+'</span></div><span class="plus">+</span><div class="col">'+tile(p.b,'')+'<span class="val">যোজনী '+p.vb+'</span></div></div><p class="q">'+p.a.n+' ও '+p.b.n+' মিলে যে যৌগ হয়, তার সংকেত কোনটি?</p><div class="opts two" style="max-width:480px">'+opts+'</div><div style="width:100%;max-width:560px;display:grid;gap:12px;justify-items:start;text-align:left">'+ledger+'</div></main></div>')}
A.fpick=d=>{const g=G;if(g.sel!==null)return;const p=g.qs[g.i],idx=+d.i,c=p.o[idx];g.sel=idx;if(c[0]===p.cx&&c[1]===p.cy){g.ok++;g.score+=10;burst(24)}renderFormula()};
A.fnext=()=>{if(G.i+1<G.qs.length){G.i++;G.sel=null;renderFormula();scrollTo(0,0);return}const isBest=commit('formula',G.score);
  results({title:'সংকেত পরীক্ষা শেষ',score:G.score,max:G.qs.length*10,isBest,extra:'<div class="stats"><span class="chip">সঠিক <b>'+G.ok+'/'+G.qs.length+'</b></span></div>',mode:'formula',set:G.set})};
$app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=A[b.dataset.act];if(f)f(b.dataset)});
document.addEventListener('keydown',e=>{if(G&&G.mode==='speed'&&!G.over&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&/^[0-4]$/.test(e.key))answerSpeed(+e.key)});
home();
</script></body></html>
