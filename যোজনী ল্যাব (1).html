<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>যোজনী ল্যাব</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;800&family=Hind+Siliguri:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: Biggan Bari brand shell. Banner on top (logo bar on phones), game title with rank, three mode cards, learning notes, brand footer. In a game the atom sits beside the controls on wide screens. Palette from the logo: navy, bulb yellow, book blue, leaf green. */
:root{
  --bg:#F2F6FB; --surface:#FFFFFF; --surface2:#E6EEF8; --ink:#0B2A4F; --muted:#55698A; --line:#D2DDEB; --dot:#D9E3F0;
  --navy:#0B3A6B; --electron:#1473D1; --on-electron:#FFFFFF; --spark:#FDB515; --on-spark:#0B2A4F; --spark-deep:#C98C00; --leaf:#2E9A35;
  --good:#1A7A3A; --good-bg:#E0F4E6; --bad:#BF3A2B; --bad-bg:#FCE6E3;
  --shadow:0 1px 0 rgba(11,42,79,.04),0 10px 26px -14px rgba(11,42,79,.35);
  --c-alkali:#E2584A; --c-earth:#E59A25; --c-meta:#7C8FA0; --c-nonmetal:#1F9A82; --c-halogen:#7B5BD6; --c-noble:#2F8AD8;
  --f-display:'Baloo Da 2','Hind Siliguri','Noto Sans Bengali',sans-serif;
  --f-body:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono','Hind Siliguri','Noto Sans Bengali',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#091524; --surface:#10233A; --surface2:#183049; --ink:#E8F0FA; --muted:#9BB0C8; --line:#264261; --dot:#0F2339;
    --navy:#8DB8F5; --electron:#5E9BFF; --on-electron:#07162A; --spark:#FFC83D; --spark-deep:#B98200; --leaf:#4CC05A;
    --good:#5FD68F; --good-bg:#123A29; --bad:#FF8F84; --bad-bg:#40201D;
    --shadow:0 10px 26px -14px rgba(0,0,0,.7);
    --c-alkali:#F07A6C; --c-earth:#F2B04A; --c-meta:#9DB0C0; --c-nonmetal:#3CC3A6; --c-halogen:#A18BF0; --c-noble:#5AAEF5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#091524; --surface:#10233A; --surface2:#183049; --ink:#E8F0FA; --muted:#9BB0C8; --line:#264261; --dot:#0F2339;
  --navy:#8DB8F5; --electron:#5E9BFF; --on-electron:#07162A; --spark:#FFC83D; --spark-deep:#B98200; --leaf:#4CC05A;
  --good:#5FD68F; --good-bg:#123A29; --bad:#FF8F84; --bad-bg:#40201D;
  --shadow:0 10px 26px -14px rgba(0,0,0,.7);
  --c-alkali:#F07A6C; --c-earth:#F2B04A; --c-meta:#9DB0C0; --c-nonmetal:#3CC3A6; --c-halogen:#A18BF0; --c-noble:#5AAEF5;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.3px,transparent 1.4px);background-size:24px 24px;
  color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-block:14px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:900px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--electron);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15}
sub{font-size:.62em;vertical-align:baseline;position:relative;top:.28em;line-height:0}
img{max-width:100%}

/* brand */
.logo{width:var(--s,48px);height:var(--s,48px);background:#fff;border-radius:12px;display:grid;place-items:center;overflow:hidden;flex:none;border:1.5px solid var(--line)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.banner{border-radius:18px;overflow:hidden;background:#fff;box-shadow:var(--shadow);border:1.5px solid var(--line)}
.banner img{display:block;width:100%;height:auto}
.brandbar{display:none;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow)}
.brandbar b{display:block;font:800 22px/1.1 var(--f-display);color:var(--navy)}
.brandbar span{font-size:14px;color:var(--muted)}
@media(max-width:640px){.banner{display:none}.brandbar{display:flex}}
.footer{margin-top:36px;padding:20px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;display:grid;gap:14px;box-shadow:var(--shadow)}
.footer .fb1{display:flex;gap:14px;align-items:center}
.footer b{font:800 22px/1.1 var(--f-display);color:var(--navy);display:block}
.footer .tag{font:italic 500 14px var(--f-body);color:var(--muted)}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{display:inline-flex;align-items:center;gap:7px;font-size:13px;padding:3px 12px 3px 8px;border:1.5px solid var(--line);border-radius:99px;background:var(--bg)}
.cat::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--cc)}
.cat.now{border-color:var(--leaf);background:var(--good-bg);color:var(--good);font-weight:600}

/* element tile */
.tile{--fam:var(--c-nonmetal);position:relative;display:grid;place-items:center;align-content:center;width:112px;aspect-ratio:1;
  background:color-mix(in srgb,var(--fam) 16%,var(--surface));border:2px solid var(--fam);border-radius:8px;padding:6px;text-align:center;flex:none;
  box-shadow:0 5px 0 color-mix(in srgb,var(--fam) 45%,transparent)}
.tile .tz{position:absolute;top:6px;left:8px;font:600 13px/1 var(--f-mono)}
.tile .tsym{font:600 40px/1 var(--f-mono)}
.tile .tname{font-size:12px;line-height:1.2;margin-top:5px;color:var(--muted)}
.tile.lg{width:150px}.tile.lg .tsym{font-size:54px}.tile.lg .tname{font-size:14px}
.tile.sm{width:56px;padding:2px;box-shadow:none}.tile.sm .tsym{font-size:22px}.tile.sm .tz{font-size:10px;top:3px;left:5px}.tile.sm .tname{display:none}

/* home */
.home>*+*{margin-top:18px}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;padding-block:10px 4px;animation:rise .5s ease both}
.hero h1{font-size:clamp(38px,8vw,56px);font-weight:800;color:var(--navy)}
.kicker{display:inline-block;font-size:13px;font-weight:600;color:var(--on-spark);background:var(--spark);padding:1px 12px;border-radius:99px;margin-bottom:6px}
.lede{color:var(--muted);max-width:38ch;margin-top:4px}
@media(max-width:480px){.hero{grid-template-columns:1fr;justify-items:start}}
.rank{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px;box-shadow:var(--shadow)}
.rank .r1{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.rank b{font-family:var(--f-display);font-size:20px;font-weight:600}
.bar{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--electron),var(--spark));border-radius:99px}
.small{font-size:13px;color:var(--muted)}
.modes{display:grid;gap:12px}
.mode{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:16px;align-items:center;text-align:left;background:var(--surface);
  border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.mode:hover{border-color:var(--electron);transform:translateY(-2px)}
.mode:active{transform:translateY(1px)}
.mode .ic{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;background:var(--mc);color:var(--mi);box-shadow:0 4px 0 color-mix(in srgb,var(--mc) 55%,#000 15%)}
.mode .ic svg{width:34px;height:34px}
.mode h2{font-size:22px;font-weight:600;color:var(--navy)}
.mode p{font-size:14px;color:var(--muted);line-height:1.4;margin-top:2px}
.mode .go{display:grid;gap:4px;justify-items:end}
.mode .go b{font:600 15px var(--f-display);background:var(--spark);color:var(--on-spark);padding:3px 14px;border-radius:99px;box-shadow:0 3px 0 var(--spark-deep)}
.mode .best{font-size:12px;color:var(--muted);white-space:nowrap}
@media(max-width:520px){.mode{grid-template-columns:52px minmax(0,1fr)}.mode .ic{width:52px;height:52px}.mode .go{grid-column:2;justify-items:start;grid-auto-flow:column;justify-content:start;align-items:center;gap:10px}}
.sec>h2{font-size:23px;font-weight:600;margin-bottom:12px;color:var(--navy)}
.chain{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.chain>div{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;position:relative;min-width:0;display:grid;gap:6px;box-shadow:var(--shadow)}
.chain>div+div::before{content:"→";position:absolute;left:-18px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:20px;z-index:1}
.chain i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--f-display);font-style:normal;background:var(--cn);color:#fff}
.chain b{font:600 20px var(--f-display);color:var(--navy)}
.chain code{font:500 13px/1.4 var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.rules{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.rule{display:grid;grid-template-columns:72px minmax(0,1fr);gap:4px 14px;padding:14px 16px;align-items:center}
.rule+.rule{border-top:1.5px solid var(--line)}
.rule .range{font:700 20px/1 var(--f-display);color:var(--on-electron);background:var(--electron);text-align:center;border-radius:99px;padding:6px 0}
.rule .eg{grid-column:2;font:500 13px/1.4 var(--f-mono);color:var(--muted)}
.note{margin-top:12px;font-size:14px;color:var(--muted);max-width:68ch}
.rhyme{padding:14px 18px 14px 26px;border-left:4px solid var(--c-alkali);background-color:var(--surface);
  background-image:repeating-linear-gradient(transparent,transparent 33px,var(--line) 33px,var(--line) 34px);
  border-radius:4px 16px 16px 4px;font-size:18px;line-height:34px;box-shadow:var(--shadow)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--fam);margin-right:6px;vertical-align:-1px}

/* in-game */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:14px}
.top .ttl{font-family:var(--f-display);font-weight:600;font-size:21px;flex:1;min-width:0;color:var(--navy)}
.back,.ghost{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:6px 14px;font-size:15px;box-shadow:0 3px 0 var(--line)}
.back:hover,.ghost:hover:not(:disabled){border-color:var(--electron)}
.back:active,.ghost:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.ghost:disabled{opacity:.45;cursor:default;box-shadow:none}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:99px;padding:3px 14px;font-size:14px;white-space:nowrap}
.chip b{font-weight:700;color:var(--electron)}
.build{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.build{grid-template-columns:minmax(0,340px) minmax(0,1fr);align-items:start}}
.stage,.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;min-width:0;box-shadow:var(--shadow)}
.stage{background-image:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--electron) 12%,transparent),transparent 68%)}
.panel{display:grid;gap:14px}
.atom{display:block;width:100%;max-width:340px;margin:0 auto}
.ring{fill:none;stroke:var(--line);stroke-width:1.5}
.ring.empty{stroke-dasharray:3 6;opacity:.8}
.ring.hi{stroke:var(--spark);stroke-width:3;opacity:1}
.e{fill:var(--electron);stroke:var(--surface);stroke-width:1.5;filter:drop-shadow(0 0 3px color-mix(in srgb,var(--electron) 60%,transparent))}
.e.outer{fill:var(--spark);filter:drop-shadow(0 0 5px var(--spark))}
.e.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:center}
.nuc{fill:var(--navy)}
.nz{fill:var(--surface);font:600 21px var(--f-mono)}
.shl{fill:var(--muted);font:600 11px var(--f-mono);stroke:var(--surface);stroke-width:4px;paint-order:stroke}
.cfg{text-align:center;margin-top:8px;font:600 18px var(--f-mono);min-height:28px}
.cfg small{font:400 13px var(--f-body);color:var(--muted);display:block}
.steps{display:flex;gap:6px 14px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.step i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px;border:1.5px solid var(--line);background:var(--surface)}
.step.now{color:var(--ink);font-weight:600}
.step.now i{background:var(--electron);color:var(--on-electron);border-color:var(--electron)}
.step.done i{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.who{display:flex;gap:14px;align-items:center}
.q{font-size:18px;line-height:1.55}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.opts.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{min-height:58px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:2px solid var(--line);border-radius:12px;
  font:600 24px var(--f-display);padding:6px 10px;box-shadow:0 4px 0 var(--line);transition:border-color .12s,background .12s,transform .08s,box-shadow .08s}
.opt:hover:not(:disabled){border-color:var(--electron);box-shadow:0 4px 0 color-mix(in srgb,var(--electron) 55%,var(--line))}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt:disabled{cursor:default}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);box-shadow:none}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good);box-shadow:none}
.opt.formula{font:500 26px var(--f-mono)}
.rulebtns{display:grid;gap:10px}
.opt.left{justify-content:flex-start;text-align:left;font:500 16px/1.4 var(--f-body);min-height:54px;padding:10px 14px}
.opt.left b{font-family:var(--f-display);font-size:19px;margin-right:12px;color:var(--electron);flex:none}
.remain{display:flex;align-items:baseline;gap:10px}
.remain strong{font:600 40px/1 var(--f-display);color:var(--electron)}
.shells{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.shell{display:flex;justify-content:space-between;align-items:center;min-height:64px;padding:8px 16px;background:var(--surface);border:2px solid var(--line);border-radius:12px;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.shell:hover{border-color:var(--electron)}
.shell:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.shell b{font:600 26px var(--f-mono)}
.shell span{font-size:15px;color:var(--muted)}
.shell.full{background:var(--good-bg);border-color:var(--good);box-shadow:none}
.shell.full span{color:var(--good)}
.msg{min-height:46px;padding:10px 14px;border-radius:12px;font-size:15px;line-height:1.45}
.msg.ok{background:var(--good-bg);color:var(--good)}
.msg.bad{background:var(--bad-bg);color:var(--bad)}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.strip .sc{display:flex;flex-direction:column;align-items:center;border:1.5px solid var(--line);border-radius:8px;padding:3px 0;font:600 15px var(--f-mono);background:var(--surface)}
.strip .sc i{font:400 11px var(--f-body);font-style:normal;color:var(--muted)}
.strip .sc.me{border-color:var(--spark);background:color-mix(in srgb,var(--spark) 28%,var(--surface))}
.done{display:grid;gap:10px;padding:16px;border-radius:14px;background:var(--good-bg);color:var(--ink);animation:rise .4s ease both}
.done .big{font:800 26px var(--f-display);color:var(--good)}
.done .why{font:500 15px/1.5 var(--f-mono)}
.primary{background:var(--spark);color:var(--on-spark);border:0;border-radius:12px;padding:12px 24px;font:700 18px var(--f-display);justify-self:start;box-shadow:0 4px 0 var(--spark-deep);transition:transform .08s,box-shadow .08s}
.primary:hover{filter:brightness(1.05)}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--spark-deep)}
.shake{animation:shake .35s}

/* speed */
.track{height:14px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1.5px solid var(--line)}
.track>i{display:block;height:100%;background:linear-gradient(90deg,var(--electron),var(--leaf));transition:width .12s linear;border-radius:99px}
.track.low>i{background:var(--bad)}
.speed{display:grid;gap:16px;justify-items:center;margin-top:18px;text-align:center}
.speed .opts{width:100%;max-width:560px}
.fb{width:100%;max-width:560px;min-height:64px;padding:10px 14px;border-radius:12px;font:500 15px/1.5 var(--f-mono);text-align:left;background:var(--surface2);color:var(--muted)}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}

/* formula */
.pair{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.pair .plus{font:600 30px var(--f-display);color:var(--muted)}
.pair .col{display:grid;gap:8px;justify-items:center}
.val{font-size:14px;background:var(--spark);color:var(--on-spark);font-weight:600;border-radius:99px;padding:1px 14px}
.ledger{display:grid;gap:6px;font-size:15px;background:var(--surface2);border-radius:12px;padding:12px 14px;width:100%}
.ledger b{font-family:var(--f-mono);font-weight:500}

/* results */
.results{text-align:center;display:grid;gap:14px;justify-items:center;padding-top:16px;animation:rise .5s ease both}
.results h2{font-size:32px;font-weight:800;color:var(--navy)}
.results .cheer{color:var(--muted);max-width:40ch}
.stars{display:flex;gap:8px}
.stars svg{width:52px;height:52px;fill:var(--line)}
.stars svg.on{fill:var(--spark);filter:drop-shadow(0 3px 0 var(--spark-deep));animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.stars svg.on:nth-child(2){animation-delay:.12s}.stars svg.on:nth-child(3){animation-delay:.24s}
.score{font:800 60px/1 var(--f-display);color:var(--electron)}
.score small{font:500 17px var(--f-body);color:var(--muted)}
.newbest{background:var(--good-bg);color:var(--good);padding:3px 16px;border-radius:99px;font-weight:600;font-size:14px}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.missed{list-style:none;margin:0;padding:0;display:grid;gap:8px;width:100%;max-width:560px;text-align:left}
.missed li{display:flex;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;font:500 14px/1.45 var(--f-mono)}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* confetti */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
#fx i{position:absolute;width:9px;height:14px;border-radius:2px;animation:conf 1.2s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes conf{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--dx),calc(var(--dy) + 240px)) rotate(var(--r));opacity:0}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (max-width:520px){
  .chain{grid-template-columns:1fr}
  .chain>div+div::before{content:"↓";left:50%;top:-19px;transform:translateX(-50%)}
  .opt{font-size:21px}
  .stars svg{width:44px;height:44px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

 {z:11,s:'Na',n:'সোডিয়াম',f:'alkali'},{z:12,s:'Mg',n:'ম্যাগনেসিয়াম',f:'earth'},{z:13,s:'Al',n:'অ্যালুমিনিয়াম',f:'meta'},
 {z:14,s:'Si',n:'সিলিকন',f:'meta'},{z:15,s:'P',n:'ফসফরাস',f:'nonmetal'},{z:16,s:'S',n:'সালফার',f:'nonmetal'},
 {z:17,s:'Cl',n:'ক্লোরিন',f:'halogen'},{z:18,s:'Ar',n:'আর্গন',f:'noble'},{z:19,s:'K',n:'পটাসিয়াম',f:'alkali'},
 {z:20,s:'Ca',n:'ক্যালসিয়াম',f:'earth'}
];
const BY={};EL.forEach(e=>{BY[e.s]=e});
const CAP=[2,8,8,2];
const SH=['K','L','M','N'];

function sum(a){return a.reduce((x,y)=>x+y,0)}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(a){return a[rnd(a.length)]}
function gcd(a,b){return b?gcd(b,a%b):a}
function config(z){const c=[];let r=z;for(const cap of CAP){const t=Math.min(r,cap);if(t>0)c.push(t);r-=t}return c}
function outer(z){const c=config(z);return c[c.length-1]}
function valency(z){const o=outer(z);return o<=4?o:(o<8?8-o:0)}
function ruleOf(o){return o<=4?'a':(o<8?'b':'c')}
function why(el){
  const o=outer(el.z),v=valency(el.z);
  const calc=o<=4?'যোজনী = '+bn(o):(o<8?'৮ − '+bn(o)+' = '+bn(v):'শেষ কক্ষ পূর্ণ, যোজনী ০');
  return el.s+': '+config(el.z).map(bn).join(', ')+' → শেষ কক্ষে '+bn(o)+'টি → '+calc;
}
function fsub(n){return n>1?'<sub>'+bn(n)+'</sub>':''}
function fmt(a,x,b,y){return a.s+fsub(x)+b.s+fsub(y)}
const PAIRS=[['Na','Cl'],['Mg','O'],['H','O'],['Ca','Cl'],['Al','O'],['N','H'],['Mg','Cl'],['K','Cl'],['Na','O'],['Al','Cl'],['Ca','O'],['H','Cl'],
 ['C','H'],['Si','O'],['H','S'],['Li','F'],['Ca','F'],['Na','S'],['Al','S'],['P','H'],['C','O'],['K','O'],['Mg','F'],['Ca','S']];
function pairInfo(sa,sb){
  const a=BY[sa],b=BY[sb],va=valency(a.z),vb=valency(b.z);
  const x=vb,y=va,g=gcd(x,y);
  return {a,b,va,vb,x,y,g,cx:x/g,cy:y/g};
}
function pairOpts(p){
  const keyOf=(x,y)=>x+','+y,right=keyOf(p.cx,p.cy),seen={},out=[];
  seen[right]=1;
  const sem=[[p.cy,p.cx],[p.va,p.vb],[p.x,p.y],[p.vb,p.va]];
  const fall=shuffle([[1,2],[2,1],[1,3],[3,1],[2,3],[3,2],[1,4],[4,1],[2,2]]);
  for(const c of sem.concat(fall)){
    const k=keyOf(c[0],c[1]);
    if(!seen[k]&&c[0]>0&&c[1]>0){seen[k]=1;out.push(c)}
    if(out.length===3)break;
  }
  return shuffle([[p.cx,p.cy]].concat(out));
}

function persist(){try{localStorage.setItem('jojoni-lab-v1',JSON.stringify(save))}catch(e){}}
function commit(mode,score){const prev=save.best[mode]||0;save.total+=score;const nb=score>prev;if(nb)save.best[mode]=score;persist();return nb}
const RANKS=[[0,'নতুন ছাত্র'],[100,'ল্যাব সহকারী'],[300,'ইলেকট্রন শিকারি'],[700,'যোজনী মাস্টার'],[1500,'রসায়নবিদ']];
function rankInfo(){
  let idx=0;RANKS.forEach((r,i)=>{if(save.total>=r[0])idx=i});
  const cur=RANKS[idx],nx=RANKS[idx+1];
  return {name:cur[1],next:nx,pct:nx?Math.round((save.total-cur[0])/(nx[0]-cur[0])*100):100};
}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
const KEYS=['act','i','v','k','x','y'];
function paint(html){
  const f=document.activeElement;let key=null;
  if(f&&f.dataset&&f.dataset.act)key=KEYS.map(k=>f.dataset[k]||'').join('|');
  $app.innerHTML=html;
  if(key){for(const n of $app.querySelectorAll('[data-act]')){
    if(!n.disabled&&KEYS.map(k=>n.dataset[k]||'').join('|')===key){n.focus({preventScroll:true});break}}}
}
function tile(el,cls){
  return '<div class="tile '+(cls||'')+'" style="--fam:var(--c-'+el.f+')"><span class="tz">'+bn(el.z)+'</span><span class="tsym">'+el.s+'</span><span class="tname">'+el.n+'</span></div>';
}
function atomSVG(c,label,outerIdx,last){
  const R=[44,74,104,134];
  let s='<svg class="atom" viewBox="0 0 300 300" role="img" aria-label="পরমাণুর মডেল: নিউক্লিয়াস ও ইলেকট্রন কক্ষ">';
  R.forEach((r,i)=>{s+='<circle class="ring'+(outerIdx===i?' hi':'')+(c[i]>0?'':' empty')+'" cx="150" cy="150" r="'+r+'"/>'});
  R.forEach((r,i)=>{
    const n=c[i],a=(n?-90+180/n:180)*Math.PI/180;
    s+='<text class="shl" x="'+(150+r*Math.cos(a)).toFixed(1)+'" y="'+(150+r*Math.sin(a)).toFixed(1)+'" text-anchor="middle" dominant-baseline="central">'+SH[i]+'</text>';
  });
  R.forEach((r,i)=>{
    const n=c[i];
    for(let k=0;k<n;k++){
      const a=(-90+k*360/n)*Math.PI/180;
      const pop=last&&last[0]===i&&last[1]===k?' pop':'';
      s+='<circle class="e'+(outerIdx===i?' outer':'')+pop+'" cx="'+(150+r*Math.cos(a)).toFixed(1)+'" cy="'+(150+r*Math.sin(a)).toFixed(1)+'" r="7.5"/>';
    }
  });
  s+='<circle class="nuc" cx="150" cy="150" r="26"/><text class="nz" x="150" y="151" text-anchor="middle" dominant-baseline="central">'+label+'</text></svg>';
  return s;
}

/* ---------- confetti ---------- */
const FXCOL=['#FDB515','#1473D1','#2E9A35','#E2584A','#7B5BD6'];
function burst(n){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const fx=document.getElementById('fx');if(!fx)return;
  n=n||26;
  for(let i=0;i<n;i++){
    const p=document.createElement('i'),a=Math.random()*Math.PI*2,d=90+Math.random()*180;
    p.style.cssText='--dx:'+Math.round(Math.cos(a)*d)+'px;--dy:'+Math.round(Math.sin(a)*d-90)+'px;--r:'+rnd(540)+'deg;background:'+FXCOL[i%FXCOL.length]+';left:50%;top:42%;';
    fx.appendChild(p);
    setTimeout(()=>p.remove(),1300);
  }
}

/* ---------- build mode ---------- */
function opts1(z){

  return shuffle(shuffle(c).slice(0,3).concat([z]));
}
function startBuild(){
  stopTimer();

  const mid=shuffle(EL.filter(e=>{const o=outer(e.z);return o>=5&&o<=7})).slice(0,2);
  const low=shuffle(EL.filter(e=>outer(e.z)<=4)).slice(0,2);

function newRound(){
  const el=G.q[G.i];
  Object.assign(G,{el:el,step:1,sub:'rule',counts:[0,0,0,0],hint:false,t1:[],tr:[],tv:[],w1:0,m2:0,wr:0,wv:0,msg:'',mt:'',done:false,rp:0,last:null,shake:null,o1:opts1(el.z)});

}
function capMsg(i){

  if(i===1)return 'L কক্ষে সর্বোচ্চ ৮টি ইলেকট্রন থাকে (২ × ২² = ৮)। বাকিগুলো পরের কক্ষে দাও।';
  if(i===2)return 'M কক্ষের ধারণক্ষমতা ১৮ হলেও বাইরের কক্ষে ৮টির বেশি ইলেকট্রন থাকে না। বাকিগুলো N কক্ষে দাও।';
  return 'এই মৌলের জন্য N কক্ষে ২টির বেশি লাগে না।';
}

      '<div><button class="ghost" data-act="hint1"'+(g.hint?' disabled':'')+'>হিন্ট: মৌলের ক্রম দেখো (−৫)</button></div>'+

  }else if(g.step===2){

      '<div class="rulebtns">'+[['a','১–৪'],['b','৫–৭'],['c','৮']].map(r=>{

function setMsg(t,ty){G.msg=t;G.mt=ty||''}
function buildHandlers(A){
  A.p1=d=>{const g=G,v=+d.v;
    if(v===g.el.z){g.rp+=Math.max(0,10-2*g.w1-(g.hint?5:0));g.step=2;setMsg('ঠিক! এবার ইলেকট্রনগুলো কক্ষে বসাও।','ok')}
    else{g.w1++;g.t1.push(v);g.shake='[data-act="p1"][data-v="'+v+'"]';setMsg('এটা নয়। আবার ভাবো, লাগলে হিন্ট নাও।','bad')}
    renderBuild()};
  A.hint1=()=>{G.hint=true;renderBuild()};
  A.place=d=>{const g=G,i=+d.i,c=g.counts;
    const fail=t=>{g.m2++;g.shake='[data-act="place"][data-i="'+i+'"]';setMsg(t,'bad');renderBuild()};
    for(let j=0;j<i;j++){if(c[j]<CAP[j])return fail('আগে '+SH[j]+' কক্ষ পূর্ণ করো। ভেতরের কক্ষ আগে ভরে, তারপর বাইরের কক্ষ।')}
    if(c[i]>=CAP[i])return fail(capMsg(i));
    c[i]++;g.last=[i,c[i]-1];setMsg('','');
    if(sum(c)===g.el.z){g.rp+=Math.max(5,30-3*g.m2);g.step=3;g.sub='rule';setMsg('বিন্যাস ঠিক: '+config(g.el.z).map(bn).join(', '),'ok')}
    renderBuild()};
  A.undo=()=>{const c=G.counts;for(let i=3;i>=0;i--){if(c[i]>0){c[i]--;break}}setMsg('','');renderBuild()};
  A.rule=d=>{const g=G,o=outer(g.el.z);
    if(d.k===ruleOf(o)){g.rp+=Math.max(2,10-3*g.wr);g.sub='value';setMsg('নিয়ম ঠিক! এবার হিসাব করো।','ok')}
    else{g.wr++;g.tr.push(d.k);g.shake='[data-act="rule"][data-k="'+d.k+'"]';setMsg('এই নিয়ম এখানে খাটে না। শেষ কক্ষের সংখ্যাটা কোন ঘরে পড়ে দেখো।','bad')}
    renderBuild()};
  A.val=d=>{const g=G,v=+d.v,o=outer(g.el.z);
    if(v===valency(g.el.z)){g.rp+=Math.max(5,20-5*g.wv);g.done=true;g.pts+=g.rp;g.log.push({el:g.el,pts:g.rp});setMsg('','');burst(28)}
    else{g.wv++;g.tv.push(v);g.shake='[data-act="val"][data-v="'+v+'"]';
      const k=ruleOf(o);
      setMsg(k==='a'?'শেষ কক্ষে যে কয়টি ইলেকট্রন আছে, যোজনী সেটাই।':(k==='b'?'৮ থেকে '+bn(o)+' বিয়োগ করে দেখো।':'পূর্ণ কক্ষের যোজনী শূন্য।'),'bad')}
    renderBuild()};
  A.next=()=>{
    if(G.i+1<G.q.length){G.i++;newRound();return}
    const isBest=commit('build',G.pts);
    const extra='<ul class="missed">'+G.log.map(l=>'<li>'+tile(l.el,'sm')+'<span>'+why(l.el)+'<br>'+bn(l.pts)+' / ৭০ পয়েন্ট</span></li>').join('')+'</ul>';
    results({title:'পরীক্ষা শেষ',score:G.pts,max:350,isBest:isBest,extra:extra,again:'startBuild'});
  };
}

/* ---------- speed mode ---------- */
function startSpeed(){
  stopTimer();

}
function nextQ(){let e;do{e=pick(EL)}while(e===G.cur);G.cur=e}

function renderSpeed(){

    topbar('বিদ্যুৎ গতি','<span class="chip">ধারা <b>'+bn(g.streak)+'</b></span><span class="chip">পয়েন্ট <b>'+bn(g.score)+'</b></span>')+
    '<div class="track'+(left<10000?' low':'')+'" id="trk" role="progressbar" aria-label="বাকি সময়"><i id="fill" style="width:'+pct+'%"></i></div>'+
    '<p class="small" style="margin-top:6px;text-align:right"><span id="secs">'+bn(Math.ceil(left/1000))+'</span> সেকেন্ড বাকি</p>'+

function tick(){
  if(!G||G.mode!=='speed'||G.over)return;

  const f=document.getElementById('fill'),s=document.getElementById('secs'),t=document.getElementById('trk');
  if(f)f.style.width=Math.min(100,left/600)+'%';
  if(s)s.textContent=bn(Math.ceil(left/1000));
  if(t)t.classList.toggle('low',left<10000);
  if(left<=0)finishSpeed();

function answerSpeed(v){
  const g=G;if(!g||g.mode!=='speed'||g.over)return;
  const el=g.cur,ok=v===valency(el.z);

  else{g.streak=0;g.end-=2000;g.missed[el.s]=el;g.fb={t:'bad',m:'উত্তর '+bn(valency(el.z))+' হবে (−২ সেকেন্ড)। '+why(el)}}

}

  results({title:'সময় শেষ',score:g.score,max:0,stars:g.score>=200?3:(g.score>=100?2:1),isBest:isBest,extra:extra,again:'startSpeed'});

    topbar('সংকেত জোড়া','<span class="chip">প্রশ্ন <b>'+bn(g.i+1)+'/'+bn(g.qs.length)+'</b></span><span class="chip">পয়েন্ট <b>'+bn(g.score)+'</b></span>')+
    '<main class="speed"><div class="pair"><div class="col">'+tile(p.a,'')+'<span class="val">যোজনী '+bn(p.va)+'</span></div><span class="plus">+</span><div class="col">'+tile(p.b,'')+'<span class="val">যোজনী '+bn(p.vb)+'</span></div></div>'+
    '<p class="q">'+p.a.n+' ও '+p.b.n+' মিলে যে যৌগ হয়, তার সংকেত কোনটি?</p>'+
    '<div class="opts two" style="max-width:480px">'+opts+'</div>'+
    '<div style="width:100%;max-width:560px;display:grid;gap:12px;justify-items:start;text-align:left">'+ledger+'</div></main></div>');
}
function formulaHandlers(A){
  A.fpick=d=>{const g=G;if(g.sel!==null)return;
    const p=g.qs[g.i],idx=+d.i,c=p.o[idx];
    g.sel=idx;
    if(c[0]===p.cx&&c[1]===p.cy){g.ok++;g.score+=10;burst(24)}
    renderFormula()};
  A.fnext=()=>{
    if(G.i+1<G.qs.length){G.i++;G.sel=null;renderFormula();window.scrollTo(0,0);return}
    const isBest=commit('formula',G.score);
    results({title:'সংকেত পরীক্ষা শেষ',score:G.score,max:G.qs.length*10,isBest:isBest,
      extra:'<div class="stats"><span class="chip">সঠিক <b>'+bn(G.ok)+'/'+bn(G.qs.length)+'</b></span></div>',again:'startFormula'});
  };
}

/* ---------- wiring ---------- */
const A={home:()=>{home();window.scrollTo(0,0)},startBuild:startBuild,startSpeed:()=>{startSpeed();window.scrollTo(0,0)},startFormula:()=>{startFormula();window.scrollTo(0,0)}};
buildHandlers(A);formulaHandlers(A);
A.ans=d=>answerSpeed(+d.v);
$app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  const f=A[b.dataset.act];
  if(f)f(b.dataset);
});
document.addEventListener('keydown',e=>{
  if(G&&G.mode==='speed'&&!G.over&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&/^[0-4]$/.test(e.key))answerSpeed(+e.key);
});
home();
</script>
